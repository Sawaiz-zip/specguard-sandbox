# Roles map names to GitHub logins. Sawaiz-zip is the architect (the only role
# that can approve a scope change); contributors and AI agents have no approval
# authority. The presence of this file switches SpecGuard from advisory WARN mode
# into enforcing BLOCK mode.
roles:
  architect: [Sawaiz-zip]

rules:
  # Nobody outside the architect role may edit the lock/roles/config themselves
  # (deterministic hard block — no AI involved).
  ".specguard/**":
    edit: architect

  # A scope change to the constitution or a feature spec needs the architect's
  # approval to merge.
  ".specify/memory/constitution.md":
    scope_changes: {approve: architect}
  "specs/**/*.md":
    scope_changes: {approve: architect}
  "README.md":
    scope_changes: {approve: architect}
